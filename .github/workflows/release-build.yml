name: Sealed four-platform release build

on:
  workflow_dispatch:
    inputs:
      build:
        description: Ten-digit release build number
        required: true
        type: string
      platform:
        description: Platform set to build
        required: true
        default: all
        type: choice
        options:
          - verify
          - all
          - android
          - linux
          - windows
          - macos

permissions:
  contents: read

concurrency:
  group: sealed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.8'
  GOTOOLCHAIN: local
  FLUTTER_VERSION: '3.44.8'
  PRIVATE_CLIENT_API_BASE: ${{ secrets.RELEASE_API_BASE }}
  PRIVATE_CLIENT_API_USER_AGENT: ${{ secrets.RELEASE_API_USER_AGENT }}
  PRIVATE_CLIENT_LOGIN_PATH: ${{ secrets.RELEASE_LOGIN_PATH }}
  PRIVATE_CLIENT_CONFIG_PATH: ${{ secrets.RELEASE_CONFIG_PATH }}
  PRIVATE_CLIENT_LOGOUT_PATH: ${{ secrets.RELEASE_LOGOUT_PATH }}

jobs:
  verify:
    name: Source and exact release checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      build_matrix: ${{ steps.build_matrix.outputs.value }}
    steps:
      - name: Checkout public source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify public source boundary
        run: python3 tool/public_source_gate.py .

      - name: Verify recursive artifact gate
        run: bash .github/scripts/ci-sensitive-gate.sh self-test

      - name: Restore and apply release overlay
        shell: bash
        env:
          RELEASE_PAYLOAD_KEY: ${{ secrets.RELEASE_PAYLOAD_KEY }}
        run: bash tool/prepare_release_source.sh

      - name: Verify requested build
        shell: bash
        run: |
          [[ '${{ inputs.build }}' =~ ^[0-9]{10}$ ]]
          grep -Eq '^version:[[:space:]]*0[.]0[.]1[+]${{ inputs.build }}[[:space:]]*$' pubspec.yaml

      - name: Set up Android NDK r28c for core verification
        id: verify_ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Verify exact core module graph and builds
        working-directory: core
        shell: bash
        env:
          VERIFY_ANDROID_NDK: ${{ steps.verify_ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          tidy_diff=$(go mod tidy -diff)
          test -z "$tidy_diff" || {
            printf '%s\n' "$tidy_diff"
            exit 1
          }
          CGO_ENABLED=0 go list -deps -tags=with_gvisor ./... >/dev/null
          CGO_ENABLED=0 go test -tags=with_gvisor ./...
          CGO_ENABLED=0 go test -tags=with_gvisor \
            github.com/metacubex/mihomo/component/updater \
            github.com/metacubex/mihomo/tunnel/statistic \
            github.com/metacubex/mihomo/adapter/outbound \
            github.com/metacubex/mihomo/transport/hysteria/core \
            github.com/metacubex/sing-quic/hysteria2

          build_desktop_core() {
            local goos=$1
            local goarch=$2
            local output="$RUNNER_TEMP/core-$goos-$goarch"
            if [[ $goos == windows ]]; then
              output+=.exe
            fi
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build \
              -ldflags='-w -s' -tags=with_gvisor -o "$output"
            test -s "$output"
          }
          build_desktop_core linux amd64
          build_desktop_core windows amd64
          build_desktop_core darwin amd64
          build_desktop_core darwin arm64

          android_toolchain="$VERIFY_ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build_android_core() {
            local goarch=$1
            local compiler=$2
            local output="$RUNNER_TEMP/libclash-$goarch.so"
            GOOS=android GOARCH=$goarch CGO_ENABLED=1 CC="$android_toolchain/$compiler" \
              CFLAGS='-O3 -Werror' go build -buildmode=c-shared \
              -ldflags='-w -s' -tags=with_gvisor -o "$output"
            test -s "$output"
          }
          build_android_core arm armv7a-linux-androideabi21-clang
          build_android_core arm64 aarch64-linux-android21-clang
          build_android_core amd64 x86_64-linux-android21-clang

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve, analyze and test Flutter source
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test --reporter expanded
          (
            cd plugins/setup/buildkit/build_tool
            dart pub get
            dart test
          )

      - name: Select requested build matrix
        id: build_matrix
        shell: bash
        run: |
          case '${{ inputs.platform }}' in
            verify)
              value='{"include":[{"platform":"verify","os":"ubuntu-22.04","targets":"none","extension":"none","setup_args":""}]}'
              ;;
            all)
              value='{"include":[{"platform":"android","os":"ubuntu-22.04","targets":"apk","extension":"apk","setup_args":"--no-split-per-abi"},{"platform":"linux","os":"ubuntu-22.04","targets":"deb","extension":"deb","setup_args":""},{"platform":"windows","os":"windows-2022","targets":"zip","extension":"exe","setup_args":""},{"platform":"macos","os":"macos-15","targets":"dmg","extension":"dmg","setup_args":""}]}'
              ;;
            android)
              value='{"include":[{"platform":"android","os":"ubuntu-22.04","targets":"apk","extension":"apk","setup_args":"--no-split-per-abi"}]}'
              ;;
            linux)
              value='{"include":[{"platform":"linux","os":"ubuntu-22.04","targets":"deb","extension":"deb","setup_args":""}]}'
              ;;
            windows)
              value='{"include":[{"platform":"windows","os":"windows-2022","targets":"zip","extension":"exe","setup_args":""}]}'
              ;;
            macos)
              value='{"include":[{"platform":"macos","os":"macos-15","targets":"dmg","extension":"dmg","setup_args":""}]}'
              ;;
            *) exit 2 ;;
          esac
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"

  verify_windows:
    name: Native Windows release preflight
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout public source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify public source boundary
        run: python3 tool/public_source_gate.py .

      - name: Restore and apply release overlay
        shell: bash
        env:
          RELEASE_PAYLOAD_KEY: ${{ secrets.RELEASE_PAYLOAD_KEY }}
        run: bash tool/prepare_release_source.sh

      - name: Verify requested build
        shell: bash
        run: |
          [[ '${{ inputs.build }}' =~ ^[0-9]{10}$ ]]
          grep -Eq '^version:[[:space:]]*0[.]0[.]1[+]${{ inputs.build }}[[:space:]]*$' pubspec.yaml

      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build native Windows release package
        run: dart setup.dart windows --env stable --targets zip --verbose

      - name: Verify packaged Windows UAC manifest
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -File -Filter '*.zip' -Recurse)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Windows ZIP.' }

          $cmake = Get-Content -LiteralPath 'windows/CMakeLists.txt' -Raw
          $binaryName = [regex]::Match(
            $cmake,
            '(?m)^set\(BINARY_NAME "([^"]+)"\)\s*$'
          )
          if (-not $binaryName.Success) {
            throw 'Unable to resolve the Windows GUI executable name.'
          }
          $executable = Join-Path `
            'build/windows/x64/runner/Release' `
            ($binaryName.Groups[1].Value + '.exe')
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'Windows GUI executable is missing.'
          }

          $manifestTool = @(
            Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" -File
          ) | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if ($null -eq $manifestTool) { throw 'Windows manifest tool was not found.' }

          $manifest = Join-Path $env:RUNNER_TEMP 'windows-runner.manifest'
          & $manifestTool.FullName `
            "-inputresource:$executable;#1" `
            "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the Windows manifest.' }

          $content = Get-Content -LiteralPath $manifest -Raw
          $requests = [regex]::Matches(
            $content,
            '<requestedExecutionLevel\b[^>]*/?>'
          )
          if ($requests.Count -ne 1) {
            throw 'Expected exactly one requestedExecutionLevel element.'
          }
          $request = $requests[0].Value
          if ($request -notmatch 'level\s*=\s*["'']requireAdministrator["'']') {
            throw 'Windows GUI does not require administrator elevation.'
          }
          if ($request -notmatch 'uiAccess\s*=\s*["'']false["'']') {
            throw 'Windows GUI has an unexpected uiAccess value.'
          }

      - name: Remove plaintext preflight inputs and outputs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          Remove-Item -Force `
            core_sha256.json, `
            core/client_build_config_generated.go `
            -ErrorAction SilentlyContinue

  build:
    name: Build sealed ${{ matrix.platform }} package
    needs: [verify, verify_windows]
    if: inputs.platform != 'verify'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.build_matrix) }}
    steps:
      - name: Checkout public source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify public source boundary
        run: python3 tool/public_source_gate.py .

      - name: Restore and apply release overlay
        shell: bash
        env:
          RELEASE_PAYLOAD_KEY: ${{ secrets.RELEASE_PAYLOAD_KEY }}
        run: bash tool/prepare_release_source.sh

      - name: Verify requested build
        shell: bash
        run: |
          [[ '${{ inputs.build }}' =~ ^[0-9]{10}$ ]]
          grep -Eq '^version:[[:space:]]*0[.]0[.]1[+]${{ inputs.build }}[[:space:]]*$' pubspec.yaml

      - name: Free Android runner disk space
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sudo rm -rf -- \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet
          df -h /

      - name: Enable Windows long paths
        if: matrix.platform == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK r28c
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Select Xcode 26.3
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer_dir"
          test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)" = 'Xcode 26.3'
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          apt-get update -y &&
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          apt-get install -y
          libayatana-appindicator3-dev libkeybinder-3.0-dev libgtk-3-dev
          libfuse2 locate ninja-build patchelf rpm

      - name: Restore Android signing identity
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set +x
          for variable in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            test -n "${!variable}"
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.p12
          flutter_bin=$(command -v flutter)
          flutter_sdk=$(cd "$(dirname "$flutter_bin")/.." && pwd -P)
          {
            printf 'flutter.sdk=%s\n' "$flutter_sdk"
            printf 'storeFile=release.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/local.properties
          keystore_digest=$(openssl pkcs12 \
            -in android/app/release.p12 \
            -passin env:STORE_PASSWORD \
            -clcerts -nokeys 2>/dev/null | \
            openssl x509 -outform der 2>/dev/null | \
            sha256sum | awk '{print $1}')
          test "$keystore_digest" = "$EXPECTED_ANDROID_CERT_SHA256"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build package
        run: >-
          dart setup.dart ${{ matrix.platform }}
          --env stable
          --targets ${{ matrix.targets }}
          ${{ matrix.setup_args }}

      - name: Build Windows interactive self-extractor
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist -File -Filter '*.zip' -Recurse)
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows ZIP.' }
          $tools = Join-Path $env:RUNNER_TEMP 'sevenzip-tools'
          New-Item -ItemType Directory -Path $tools | Out-Null
          $extractor = Join-Path $tools 'extractor.exe'
          $license = Join-Path $tools 'license.txt'
          Invoke-WebRequest -Uri 'https://www.7-zip.org/a/7zr.exe' -OutFile $extractor
          Invoke-WebRequest -Uri 'https://www.7-zip.org/license.txt' -OutFile $license
          $stage = Join-Path $env:RUNNER_TEMP 'sealed-package-stage'
          if (Test-Path -LiteralPath $stage) { throw 'Package staging path already exists.' }
          New-Item -ItemType Directory -Path $stage | Out-Null
          & tool/windows_sfx/build.ps1 `
            $zip[0].FullName $extractor $license $PWD.Path `
            (Join-Path $stage 'package.exe')

      - name: Stage one generic package filename
        if: matrix.platform != 'windows' && matrix.platform != 'android'
        shell: bash
        run: |
          packages=()
          while IFS= read -r -d '' package; do
            packages+=("$package")
          done < <(find dist -type f -name '*.${{ matrix.extension }}' -print0)
          test "${#packages[@]}" -eq 1
          stage="$RUNNER_TEMP/sealed-package-stage"
          test ! -e "$stage"
          mkdir "$stage"
          cp -- "${packages[0]}" "$stage/package.${{ matrix.extension }}"

      - name: Stage Android package from Flutter output
        if: matrix.platform == 'android'
        shell: bash
        run: |
          package='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$package"
          stage="$RUNNER_TEMP/sealed-package-stage"
          test ! -e "$stage"
          mkdir "$stage"
          cp -- "$package" "$stage/package.apk"

      - name: Verify Android signature
        if: matrix.platform == 'android'
        shell: bash
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/sealed-package-stage/package.apk" > "$RUNNER_TEMP/android-signature.txt"
          normalized=$(tr '[:upper:]' '[:lower:]' < "$RUNNER_TEMP/android-signature.txt" | tr -d '[:space:]:')
          grep -Fq "$EXPECTED_ANDROID_CERT_SHA256" <<< "$normalized"

      - name: Gate package and seal artifact
        shell: bash
        env:
          OUTPUT_PASSPHRASE: ${{ secrets.OUTPUT_PASSPHRASE }}
        run: |
          set +x
          test -n "$OUTPUT_PASSPHRASE"
          bash .github/scripts/ci-sensitive-gate.sh artifacts "$RUNNER_TEMP/sealed-package-stage"
          mkdir sealed
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:OUTPUT_PASSPHRASE \
            -in "$RUNNER_TEMP/sealed-package-stage/package.${{ matrix.extension }}" \
            -out sealed/package.bin

      - name: Remove plaintext build inputs
        if: always()
        shell: bash
        run: |
          find dist "$RUNNER_TEMP/sealed-package-stage" -type f -delete 2>/dev/null || true
          find "$RUNNER_TEMP/release-payload" -type f -delete 2>/dev/null || true
          rm -f core_sha256.json core/client_build_config_generated.go \
            android/local.properties android/app/release.p12

      - name: Upload sealed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-${{ matrix.platform }}-${{ github.run_id }}
          path: sealed/package.bin
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0
